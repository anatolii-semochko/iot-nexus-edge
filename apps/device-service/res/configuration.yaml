Writable:
  LogLevel: "INFO"

Service:
  Host: "0.0.0.0"
  Port: 59999
  StartupMsg: "NexusEdge device-service started"

MessageBus:
  Optional:
    ClientId: "device-nexus-edge"

Device:
  ProfilesDir: "./res/profiles"
  DevicesDir: "./res/devices"
  Discovery:
    Enabled: false
  # Device pushes (MQTT transport today) are forwarded as async readings
  # (AGENTS.md section 80). Buffer sized for bursts of pushes arriving
  # faster than the SDK publishes them to the EdgeX bus.
  EnableAsyncReadings: true
  AsyncBufferSize: 16
