# Source of truth for this device type's EdgeX-facing shape. The copy
# actually loaded by apps/device-service lives at
# apps/device-service/res/profiles/NexusEdge-Ph.yaml - kept in sync by
# hand (AGENTS.md section 7). Identical content.
name: "NexusEdge-Ph"
manufacturer: "NexusEdge"
model: "ph"
labels:
  - "sensor"
description: "pH - atomic device, one Float32 value"

deviceResources:
  # "PH", not "Ph": the aquarium's devices were registered with it first
  # (its own copy of this type, 2026-10-09; merged into this one 2026-11-19).
  - name: "PH"
    isHidden: false
    description: "pH reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX level although read-only for the platform - the
      # simulate endpoints (and a physical write) push readings through
      # core-command (same as ../pressure).
      readWrite: "RW"
      units: "pH"

deviceCommands: []
