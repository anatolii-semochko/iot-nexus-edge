# Copy of devices/standalone/sensor/rain/edgex-device-profile.yaml (the
# source of truth) - kept in sync by hand (AGENTS.md section 7).
name: "NexusEdge-Rain"
manufacturer: "NexusEdge"
model: "rain"
labels:
  - "sensor"
description: "Rain sensor (surface wetness) - atomic device, one Float32 value"

deviceResources:
  - name: "Rain"
    isHidden: false
    description: "Rain sensor (surface wetness) reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX level although read-only for the platform - the
      # simulate endpoints (and a physical CAN write) push readings through
      # core-command (same as ../pressure).
      readWrite: "RW"
      units: "%"

deviceCommands: []
