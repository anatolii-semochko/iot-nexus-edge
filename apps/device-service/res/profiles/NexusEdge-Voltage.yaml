# Copy of devices/standalone/sensor/voltage/edgex-device-profile.yaml (the
# source of truth) - kept in sync by hand (AGENTS.md section 7).
name: "NexusEdge-Voltage"
manufacturer: "NexusEdge"
model: "voltage"
labels:
  - "sensor"
description: "Voltage measurement - atomic device, one Float32 value"

deviceResources:
  - name: "Voltage"
    isHidden: false
    description: "Voltage measurement reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX level although read-only for the platform - the
      # simulate endpoints (and a physical write) push readings through
      # core-command (same as ../pressure).
      readWrite: "RW"
      units: "V"

deviceCommands: []
