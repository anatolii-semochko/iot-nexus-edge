# Copy of devices/standalone/sensor/thermal-power/edgex-device-profile.yaml
# (the source of truth) - kept in sync by hand (AGENTS.md section 7).
name: "NexusEdge-ThermalPower"
manufacturer: "NexusEdge"
model: "thermal-power"
labels:
  - "sensor"
description: "Thermal power measurement - atomic device, one Float32 value"

deviceResources:
  - name: "ThermalPower"
    isHidden: false
    description: "Thermal power measurement reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX level although read-only for the platform - the
      # simulate endpoints (and a physical write) push readings through
      # core-command (same as ../pressure).
      readWrite: "RW"
      units: "kW"

deviceCommands: []
