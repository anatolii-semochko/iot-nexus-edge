# Copy of devices/standalone/sensor/current/edgex-device-profile.yaml (the
# source of truth) - kept in sync by hand (AGENTS.md section 7).
name: "NexusEdge-Current"
manufacturer: "NexusEdge"
model: "current"
labels:
  - "sensor"
description: "Current measurement - atomic device, one Float32 value"

deviceResources:
  - name: "Current"
    isHidden: false
    description: "Current measurement reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX level although read-only for the platform - the
      # simulate endpoints (and a physical write) push readings through
      # core-command (same as ../pressure).
      readWrite: "RW"
      units: "A"

deviceCommands: []
