# Copy of devices/standalone/sensor/energy/edgex-device-profile.yaml (the
# source of truth) - kept in sync by hand (AGENTS.md section 7).
name: "NexusEdge-Energy"
manufacturer: "NexusEdge"
model: "energy"
labels:
  - "sensor"
description: "Energy counter - atomic device, one Float32 value"

deviceResources:
  - name: "Energy"
    isHidden: false
    description: "Energy counter reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX level although read-only for the platform - the
      # simulate endpoints (and a physical write) push readings through
      # core-command (same as ../pressure).
      readWrite: "RW"
      units: "kWh"

deviceCommands: []
