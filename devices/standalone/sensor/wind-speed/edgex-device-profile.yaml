# Source of truth for this device type's EdgeX-facing shape. The copy
# actually loaded by apps/device-service lives at
# apps/device-service/res/profiles/NexusEdge-WindSpeed.yaml - kept in sync by
# hand (AGENTS.md section 7). Identical content.
name: "NexusEdge-WindSpeed"
manufacturer: "NexusEdge"
model: "wind-speed"
labels:
  - "sensor"
description: "Wind speed sensor - atomic device, one Float32 value"

deviceResources:
  - name: "WindSpeed"
    isHidden: false
    description: "Wind speed sensor reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX level although read-only for the platform - the
      # simulate endpoints (and a physical CAN write) push readings through
      # core-command (same as ../pressure).
      readWrite: "RW"
      units: "m/s"

deviceCommands: []
