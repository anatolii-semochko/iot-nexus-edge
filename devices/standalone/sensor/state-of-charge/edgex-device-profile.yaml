# Source of truth for this device type's EdgeX-facing shape. The copy
# actually loaded by apps/device-service lives at
# apps/device-service/res/profiles/NexusEdge-StateOfCharge.yaml - kept in sync by
# hand (AGENTS.md section 7). Identical content.
name: "NexusEdge-StateOfCharge"
manufacturer: "NexusEdge"
model: "state-of-charge"
labels:
  - "sensor"
description: "Battery state of charge - atomic device, one Float32 value"

deviceResources:
  - name: "StateOfCharge"
    isHidden: false
    description: "Battery state of charge reading"
    properties:
      valueType: "Float32"
      # RW at the EdgeX level although read-only for the platform - the
      # simulate endpoints (and a physical write) push readings through
      # core-command (same as ../pressure).
      readWrite: "RW"
      units: "%"

deviceCommands: []
