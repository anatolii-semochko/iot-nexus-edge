; PlatformIO project for the "ai-camera" node (AI Analyzing Camera,
; AGENTS_TO_DO.md 2026-09-24/26) - ESP32-CAM (AI-Thinker) + OV3660,
; Arduino framework, MQTT through ESP-IDF's own esp-mqtt client (bundled
; with the Arduino core) because a whole 3MP JPEG goes out as ONE MQTT
; message - the popular PubSubClient can't do that. See ./README.md
; before building/flashing.

[env:esp32cam]
; Arduino-ESP32 2.0.x (ESP-IDF 4.4) - src/mqtt_link.cpp uses the IDF 4.4
; flat esp_mqtt_client_config_t layout. Moving to Arduino 3.x / IDF 5
; means porting that one struct to the nested IDF 5 layout.
platform = espressif32@^6.9.0
board = esp32cam
framework = arduino

lib_deps =
    tzapu/WiFiManager@^2.0.17
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.12.1
    bblanchon/ArduinoJson@^7.4.2

; PSRAM holds the camera frame buffer (a 3MP JPEG doesn't fit in internal
; RAM) and the MQTT outbox copy of the frame.
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Flash on the ESP32-CAM-MB (the camera board alone, peripherals
; disconnected - see ../docs/wiring.md).
monitor_speed = 115200
