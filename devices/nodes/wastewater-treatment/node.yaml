nodeType: wastewater-treatment
description: >
  The wastewater treatment of a surface-treatment shop: the collection
  tank taking the rinses' overflow (its level, the transfer pump), the
  neutralization (its pH probe, the acid and the caustic dosing pumps), the
  settler (its sludge level), the filter press, the discharge's flow meter.
  Reports the levels, the pH and the flow; its pumps and the press switched
  on / off. Driven by the `chem-wastewater` process (simulated - the rinses'
  acid drag-out, the dosing, the sludge).
bus:
  type: modbus-tcp
supports:
  - ph
  - flow-rate
  - level
  - relay
