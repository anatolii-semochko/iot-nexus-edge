nodeType: fan-coil
description: >
  A wall-mounted hydronic fan coil - a room's heat / cold consumer on
  the water circuit. Reference: Daikin FWT (wall-mounted, 2-pipe,
  heating and cooling, 3 fan speeds, about 2 - 5 kW). Reports the room
  temperature and humidity, the fan's electric power and speed; its
  valve opens / closes remotely. Driven by the `heating-control` process
  (simulated - the heat it gives from the water and the room
  temperatures and the fan speed).
bus:
  type: modbus-tcp
supports:
  - temperature
  - humidity
  - relay
  - power
  - rotational-speed
