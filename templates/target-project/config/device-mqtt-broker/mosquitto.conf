# Device broker (AGENTS.md section 79) - the MQTT broker network nodes
# (WiFi/Ethernet) talk to, via the device-service's MQTT transport. A
# separate instance from edgex-mqtt-broker, which is EdgeX's own internal
# message bus and never exposed outside the Docker network.
#
# Anonymous for now, LAN only: node authentication and TLS are deferred
# to the platform-wide authorization task (AGENTS_TO_DO.md 2026-09-24/26).
# Do not expose this port beyond the LAN until then.
listener 1883
allow_anonymous true

# Largest accepted MQTT packet: one camera frame is sent as a single
# message (0.5-1 MB for a 3MP JPEG), so this leaves headroom. Raise it
# here, not in code, if a future device sends bigger payloads.
max_packet_size 4194304

# No on-disk state: retained values live in memory and devices re-publish
# after a broker restart. Keeps the container read-only.
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
